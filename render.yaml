services:
  - type: web
    name: planbound
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn engine.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PLANREVIEW_API_SECRET
        generateValue: true
